# Read by the Gboard Material You module (NPatch/Xposed).
# The module renders the dark or light template below into `target`
# with your current wallpaper colors, every time they change.
#
# Placeholders: {{palette:tone}} or {{palette:tone:AA}} (AA = hex alpha)
#   palette: primary, secondary, tertiary, neutral, neutral_variant
#            (or accent1, accent2, accent3, neutral1, neutral2)
#   tone:    0 (black) .. 100 (white), Material You tone scale
target=colors.css
# system = follow Android dark mode, or force: dark | light
mode=system
dark=materialyou_dark.css.in
light=materialyou_light.css.in
