name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Test and build module
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Pack theme
        run: theme/build_theme.sh build/3D_Template_MaterialYou.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GboardMaterialYou
          path: |
            app/build/outputs/apk/release/app-release.apk
            build/3D_Template_MaterialYou.zip
